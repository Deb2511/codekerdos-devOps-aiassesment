global
    log stdout format raw local0
    maxconn 1024

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    # Submit waits for Claude evaluation, which can take several minutes
    timeout client 300s
    timeout server 300s

# Docker's internal DNS returns one address per backend container,
# so HAProxy follows the "backend" name as containers are added or removed
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    hold valid 10s

frontend api
    bind *:8080
    default_backend backend_api

backend backend_api
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server-template be 1-10 backend:5000 check resolvers docker init-addr none
